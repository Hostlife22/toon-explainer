name: Gallery

# Publishes gallery.html (every README picture with links to its spec and storyboard) to GitHub Pages.
# Runs only when the pictures, the example specs or storyboards, or the gallery generator change.
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'examples/**/spec.json'
      - 'examples/**/script.md'
      - 'README.md'
      - 'scripts/make_gallery.py'
      - 'scripts/make_media.py'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gallery-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the gallery site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check that the committed gallery is current
        run: python3 scripts/make_gallery.py --check

      - name: Assemble the site
        env:
          SOURCE_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/
        run: |
          mkdir -p _site/scripts/engine/lib
          python3 scripts/make_gallery.py --out _site/index.html --source-base "$SOURCE_BASE"
          cp -R assets _site/assets
          cp -R scripts/engine/lib/fonts _site/scripts/engine/lib/fonts
          rm -f _site/assets/media.json
          touch _site/.nojekyll
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
